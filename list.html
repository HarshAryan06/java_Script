<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        ol li::marker {
            content: "->";
            color : red;

        }
    </style>

<head>
<body>
    
    <h1>Order List</h1>
    <ol type= "i" start="2">
        <li>Harsh</li>
        <li>Aryan</li>
        <li>Jia</li>
        <li>Roy</li>
    </ol>

    <h1>Unorder List</h1>
    <ul type = "a">
        <li>Harsh</li>
        <li>Aryan</li>
        <li>Jia</li>
    </ul>
    
    <h1>Description List</h1>
    <dl>
    
    <dt>Chicken biryani</dt>
    <dd>The taste of biryani is good !!!</dd>
    <br>
    <dd>Types of biryani</dd>
        <ol>
            <li>ambu</li>
            <li>Hydrabadi</li>
        </ol>
    </dl>

</body>
</html>
