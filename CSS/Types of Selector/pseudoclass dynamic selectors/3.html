<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo class</title>
    <style>
      a {
        text-decoration: none;
      }
      a:link {
        color: brown;
      }
      a:visited {
        color: palevioletred;
      }
      a:hover {
        color: green;
      }
      a:active {
        color: aqua;
      }
      div{
        height:100px;
        width:200px;
        background-color: green;
      }
      div:hover{
        height:100px;
        width:100px;
        background-color: aquamarine;
      }
    </style>
  </head>
  <body>
    <h3>Pseudo class</h3>
    <a href="www.amazon.in" target="_self">amazon</a><br />
    <a href="www.wikipedia.org" target="_blank">wikipedia</a><br />
    <a href="www.google.com" target="_self">google</a><br />
    <a href="www.facebook.com" target="_blank">facebook</a>
  </body>
  <div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsa, tenetur!</p>
  </div>
</html>
