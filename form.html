<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>
    <!--An html form is a section of a web from which collect infromation from the user -->
    <h1 align = center>Inline forms</h1>

    <form> 
        <label> Username</label>
        <input type="text">
        <label> Password</label>
        <input type="text">
        <input type="submit">
    </form>

    <h1 align = center> Horizontal Forms</h1>
    <form>

        <label>Username</label>
        <input type="text">
        <br/>
        <label> Password</label>
        <input type="text">
        <br/>
        <input type="submit">
    </form>

     <h1 align = center> Vertical Forms</h1>
    <form>

        <label>Username</label>
        <input type="text">
        <br/>
        <label> Password</label>
        <input type="text">
        <br/>
        <input type="submit">
    </form>
</body>
